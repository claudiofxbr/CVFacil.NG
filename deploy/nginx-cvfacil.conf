# Reverse proxy para deploy do CVFacil.NG na VPS Hostinger.
# Colocar em /etc/nginx/sites-available/cvfacil e criar symlink em /etc/nginx/sites-enabled/.

server {
    listen 80;
    server_name cvfacil.xavierbr-vps.tech;

    # Frontend (Next.js - next start, porta 3003 - 3000/3002 ja ocupadas na VPS por EasyPanel/CVFacil.NG antigo)
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend (Spring Boot, porta 7777)
    location /api/ {
        proxy_pass http://127.0.0.1:7777/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 15M;
}

# Depois de validar o domínio com certbot (Let's Encrypt), rodar:
#   sudo certbot --nginx -d cvfacil.xavierbr-vps.tech
# para gerar automaticamente o bloco HTTPS (porta 443) e o redirect 80->443.

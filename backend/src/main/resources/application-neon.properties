# Neon Cloud Database Configuration
server.port=7777
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-small-shadow-acm4l09l-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&assumeMinServerVersion=14&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.table=cvfacil_history

# HikariCP Performance & Resilience (Neon optimized)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.validation-timeout=5000

# Storage (Photos)
storage.location=${STORAGE_LOCATION:./uploads/photos}

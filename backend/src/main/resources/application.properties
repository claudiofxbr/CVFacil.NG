# OMNISCIENCE v11.0 - Total Isolation
server.port=7777
spring.main.banner-mode=console
debug=false
# Resolve IP real do cliente a partir de X-Forwarded-For quando atrás de proxy reverso (nginx)
server.forward-headers-strategy=framework

# Active Profile
spring.profiles.active=neon

# Database Persistence (H2 File Mode) - COMMENTED
# spring.datasource.url=jdbc:h2:file:./data/cvfacil_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ISOLATION: Re-enabling database core for production sync
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs
logging.level.root=INFO
logging.level.com.cvfacil.ng=DEBUG

# Optimization
spring.jackson.serialization.fail-on-empty-beans=false

# File Storage Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
storage.location=./uploads/photos
# Security & Root Configuration
app.root.email=${ROOT_EMAIL}
app.root.password=${ROOT_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - origens permitidas (separadas por vírgula). Sobrescrever via env var em produção.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Google OAuth2 (Google.com.br)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
gemini.api.key=${GEMINI_API_KEY}
